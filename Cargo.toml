[package]
name = "neirobot-lit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arc-swap = "1.8.2"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.15"
socket2 = "0.6.2"
native-tls = "0.2.16"

fast-float = "0.2"
toml = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time", "json"] }
tracing-appender = "0.2.3"
clap = { version = "4.5.59", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tokio-native-tls = "0.3"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
tokio-stream = "0.1.18"
tokio-util = { version = "0.7.18", features = ["codec", "compat", "io-util", "net", "rt", "time"] }
futures-util = "0.3.31"
url = "2.5.8"
dotenvy = "0.15.7"
chrono = { version = "0.4.41", features = ["clock", "serde"] }
circular-buffer = "1.2.0"
reqwest = { version = "0.13.2", features = ["json", "rustls", "blocking"] }
ratatui = "0.30.0"
crossterm = "0.29.0"
hmac = "0.12.1"
sha2 = "0.10.9"
diffy = "0.4.2"
hex = "0.4.3"
rust_decimal = { version = "1.40.0", features = ["serde-float"] }
secrecy = { version = "0.10.3", features = ["serde"] }
ort = { version = "2.0.0-rc.6", features = ["ndarray", "cuda", "tensorrt"] }
polars = { version = "0.53.0", features = ["parquet", "lazy", "new_streaming", "regex", "temporal", "dtype-datetime", "dtype-date", "dtype-duration"] }
ndarray = "0.17.2"
ordered-float = "5.1.0"
rand = "0.10.0"
rand_distr = "0.6.0"
crc32fast = "1.5.0"
governor = "0.10.4"
nonzero_ext = "0.3.0"
smallvec = { version = "1.15.1", features = ["serde"] }
lazy_static = "1.5.0"
csv = "1.4.0"
async-trait = "0.1.89"
num_cpus = "1.17.0"
nix = "0.30.1"
libc = "0.2.180"
core_affinity = "0.8.3"
hdrhistogram = "7.5.4"
parking_lot = "0.12.5"
axum = { version = "0.7", features = ["json"] }
ureq = "3.2.0"
prometheus = "0.14"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
sysinfo = "0.38.2"
zstd = "0.13.3"
mimalloc = { version = "0.1.48", default-features = false }
wide = "1.0"
aligned-vec = "0.6.4"
aes-gcm = "0.10.3"
argon2 = "0.5.3"
zeroize = { version = "1.8.2", features = ["derive"] }
base64 = "0.22.1"
tempfile = "3.25.0"
dashmap = "6.1.0"
fs2 = "0.4.3"
tower-http = { version = "0.6.8", features = ["cors"] }
tikv-jemallocator = { version = "0.6.1", optional = true }

[features]
chaos = []
jemalloc = ["tikv-jemallocator"]

[dev-dependencies]
tokio-test = "0.4.5"
approx = "0.5.1"
serde_json = "1.0.149"
mockall = "0.14.0"
async-trait = "0.1.89"
tracing-test = "0.2.6"
tempfile = "3.25.0"
mockito = "1.7.2"
criterion = { version = "0.8.2", features = ["async_tokio", "html_reports"] }
rust_decimal_macros = "1.40.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
panic = "abort"

[[bench]]
name = "hot_path"
harness = false

[[bin]]
name = "crypto_tool"
path = "src/bin/crypto_tool.rs"

[[bin]]
name = "neirobot-lit"
path = "src/bin/run-bot.rs"
